name: Migrate TUI v2 tests

on:
  push:
    branches:
      - feat/tui-v2-fonts-themes

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/tui-v2-fonts-themes
      - name: Align legacy TUI tests with v2
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("internal/tui/tui_test.go")
          text = path.read_text()

          def replace(old: str, new: str, count: int = 1) -> None:
              global text
              if text.count(old) < count:
                  raise SystemExit(f"expected replacement missing: {old[:80]!r}")
              text = text.replace(old, new, count)

          replace('strings.Contains(model.apply(), "press y to confirm")', 'strings.Contains(model.apply(), "Press y to apply")')
          text = text.replace("\tmodel.tab = 2\n", "\tmodel.setTab(tabPreview)\n")
          text = text.replace("\tmodel.tab = 5\n", "\tmodel.setTab(tabThemes)\n")
          text = text.replace(
              "\tmodel.tab = tabPlugins\n\tmodel.cursor = 0\n",
              "\tmodel.tab = tabPlugins\n\tmodel.pluginAdvanced = true\n\tmodel.cursor = len(model.cfg.Plugins.Selected)\n",
          )
          replace('model.previewThemeConfig("neon-red")', 'model.previewThemeConfig("dracula")')

          old_views = '''\tfor _, tc := range []struct {
          \t\ttab  int
          \t\twant string
          \t}{
          \t\t{tab: 0, want: "config:"},
          \t\t{tab: 1, want: "segments"},
          \t\t{tab: 2, want: "context"},
          \t\t{tab: 3, want: "planned .zshrc diff"},
          \t\t{tab: 4, want: "press enter to fix"},
          \t\t{tab: 5, want: "theme gallery"},
          \t\t{tab: 6, want: "plugins"},
          \t} {'''.replace("          ", "")
          new_views = '''\tfor _, tc := range []struct {
          \t\ttab  int
          \t\twant string
          \t}{
          \t\t{tab: tabHome, want: "Welcome"},
          \t\t{tab: tabPrompt, want: "Segments"},
          \t\t{tab: tabThemes, want: "Theme gallery"},
          \t\t{tab: tabPlugins, want: "Recommended setup"},
          \t\t{tab: tabPreview, want: "Context"},
          \t} {'''.replace("          ", "")
          replace(old_views, new_views)
          replace('strings.Contains(msg, "open Apply tab")', 'strings.Contains(msg, "Review & Apply")')

          replace(
              '''\tmodel.tab = tabPlugins
          
          \tupdated, _ := model.Update(tea.KeyMsg{Type: tea.KeyRunes, Runes: []rune{'x'}})'''.replace("          ", ""),
              '''\tmodel.tab = tabPlugins
          \tmodel.pluginAdvanced = true
          \tmodel.focusPluginInput()
          
          \tupdated, _ := model.Update(tea.KeyMsg{Type: tea.KeyRunes, Runes: []rune{'x'}})'''.replace("          ", ""),
          )
          replace(
              '''\tmodel.tab = tabPlugins
          \tmodel.pluginURL.SetValue("https://example.com/x")'''.replace("          ", ""),
              '''\tmodel.tab = tabPlugins
          \tmodel.pluginAdvanced = true
          \tmodel.focusPluginInput()
          \tmodel.pluginURL.SetValue("https://example.com/x")'''.replace("          ", ""),
          )

          old_navigation = '''func TestTabNavigationWorksFromPreviewAndBuilder(t *testing.T) {
          \tmodel := NewModel(config.Default())
          \tmodel.setTab(tabPreview)
          
          \tupdated, _ := model.Update(tea.KeyMsg{Type: tea.KeyTab})
          \tmodel = updated.(Model)
          \tif model.tab != tabApply {
          \t\tt.Fatalf("preview tab navigation = %d, want apply tab", model.tab)
          \t}
          
          \tmodel.setTab(tabBuilder)
          \tupdated, _ = model.Update(tea.KeyMsg{Type: tea.KeyTab})
          \tmodel = updated.(Model)
          \tif model.tab != tabPreview {
          \t\tt.Fatalf("builder tab navigation = %d, want preview tab", model.tab)
          \t}
          
          \tupdated, _ = model.Update(tea.KeyMsg{Type: tea.KeyRight})
          \tmodel = updated.(Model)
          \tif model.tab != tabApply {
          \t\tt.Fatalf("preview right navigation = %d, want apply tab", model.tab)
          \t}
          }'''.replace("          ", "")
          new_navigation = '''func TestTabNavigationWorksFromPreviewAndBuilder(t *testing.T) {
          \tmodel := NewModel(config.Default())
          \tmodel.setTab(tabPreview)
          
          \tupdated, _ := model.Update(tea.KeyMsg{Type: tea.KeyTab})
          \tmodel = updated.(Model)
          \tif model.tab != tabHome {
          \t\tt.Fatalf("preview tab navigation = %d, want home tab", model.tab)
          \t}
          
          \tmodel.setTab(tabBuilder)
          \tupdated, _ = model.Update(tea.KeyMsg{Type: tea.KeyTab})
          \tmodel = updated.(Model)
          \tif model.tab != tabThemes {
          \t\tt.Fatalf("builder tab navigation = %d, want themes tab", model.tab)
          \t}
          
          \tupdated, _ = model.Update(tea.KeyMsg{Type: tea.KeyRight})
          \tmodel = updated.(Model)
          \tif model.tab != tabPlugins {
          \t\tt.Fatalf("themes right navigation = %d, want plugins tab", model.tab)
          \t}
          }'''.replace("          ", "")
          replace(old_navigation, new_navigation)

          start = text.index("func TestPluginNavigationWorksWhileKeepingNumericURLInput")
          end = text.index("\nfunc TestSegmentItemFormatting", start)
          text = text[:start] + '''func TestPluginNavigationWorksWhileKeepingNumericURLInput(t *testing.T) {
          \tmodel := NewModel(config.Default())
          \tmodel.setTab(tabPlugins)
          
          \tupdated, _ := model.Update(tea.KeyMsg{Type: tea.KeyRight})
          \tmodel = updated.(Model)
          \tif model.tab != tabPreview {
          \t\tt.Fatalf("plugin right navigation = %d, want preview tab", model.tab)
          \t}
          
          \tmodel.setTab(tabPlugins)
          \tupdated, _ = model.Update(tea.KeyMsg{Type: tea.KeyRunes, Runes: []rune{'2'}})
          \tmodel = updated.(Model)
          \tif model.tab != tabPrompt || model.pluginURL.Value() != "" {
          \t\tt.Fatalf("empty plugin numeric navigation tab=%d url=%q, want prompt tab and empty url", model.tab, model.pluginURL.Value())
          \t}
          
          \tmodel.setTab(tabPlugins)
          \tmodel.pluginAdvanced = true
          \tmodel.focusPluginInput()
          \tupdated, _ = model.Update(tea.KeyMsg{Type: tea.KeyRunes, Runes: []rune{'h'}})
          \tmodel = updated.(Model)
          \tupdated, _ = model.Update(tea.KeyMsg{Type: tea.KeyRunes, Runes: []rune{'2'}})
          \tmodel = updated.(Model)
          \tif model.tab != tabPlugins || model.pluginURL.Value() != "h2" {
          \t\tt.Fatalf("active plugin URL numeric input tab=%d url=%q, want plugins tab and h2", model.tab, model.pluginURL.Value())
          \t}
          }
          '''.replace("          ", "") + text[end:]

          path.write_text(text)

          part4 = Path("internal/tui/tui_v2_part4.go")
          source = part4.read_text()
          source = source.replace(
              '"github.com/snakepilot10/ozsh/internal/prompt"\n',
              '"github.com/snakepilot10/ozsh/internal/prompt"\n\t"github.com/snakepilot10/ozsh/internal/shell"\n',
              1,
          )
          old_preview = '''func (m Model) previewConfig() *config.Config {
          \treturn cloneConfig(m.cfg)
          }'''.replace("          ", "")
          new_preview = '''func (m Model) previewConfig() *config.Config {
          \tcfg := cloneConfig(m.cfg)
          \tif shell.IsTermux() {
          \t\tcfg.Prompt.DisableHeavySegments = true
          \t\tcfg.Prompt.RightPrompt = false
          \t\tcfg.Prompt.RightOrder = []string{}
          \t}
          \treturn cfg
          }'''.replace("          ", "")
          if old_preview not in source:
              raise SystemExit("previewConfig replacement missing")
          part4.write_text(source.replace(old_preview, new_preview, 1))
          PY
      - name: Format Go files
        run: gofmt -w internal/tui/tui_test.go internal/tui/tui_v2_part4.go
      - name: Remove temporary workflow
        run: rm .github/workflows/migrate-tui-v2-tests.yml
      - name: Commit migrated tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --name-only -z | xargs -0 git add --
          git commit -m 'test: migrate legacy TUI assertions to v2'
          git push origin HEAD:feat/tui-v2-fonts-themes
