name: Integrate theme catalog CLI

on:
  push:
    branches:
      - feat/tui-v2-fonts-themes

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/tui-v2-fonts-themes
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25.12'
      - name: Replace legacy theme CLI with embedded catalog
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("cmd/ozsh/main_v2.go")
          text = path.read_text()
          import_anchor = '"github.com/snakepilot10/ozsh/internal/shell"\n'
          if import_anchor not in text:
              raise SystemExit("theme import anchor missing")
          text = text.replace(
              import_anchor,
              import_anchor + 'themecatalog "github.com/snakepilot10/ozsh/internal/themes"\n',
              1,
          )

          start = text.index("func runTheme(args []string) {")
          end = text.index("func runPlugin(args []string) {", start)
          replacement = r'''func runTheme(args []string) {
	if len(args) == 0 {
		fmt.Println("Usage: ozsh theme <list|apply|preview> [name] [--variant name]")
		os.Exit(1)
	}
	switch args[0] {
	case "list":
		if len(args) != 1 {
			fmt.Fprintln(os.Stderr, "Usage: ozsh theme list")
			os.Exit(1)
		}
		for _, name := range sortedThemeNames() {
			fmt.Println(name)
			if variants := themecatalog.Variants(name); len(variants) > 0 {
				fmt.Printf("  variants: %s\n", strings.Join(variants, ", "))
			}
		}
	case "apply", "preview":
		name, variant, err := parseThemeSelection(args[1:])
		if err != nil {
			fmt.Fprintf(os.Stderr, "theme %s error: %v\n", args[0], err)
			os.Exit(1)
		}
		preset, ok := themecatalog.Get(name, variant)
		if !ok {
			if variant == "" {
				fmt.Fprintf(os.Stderr, "unknown theme: %s\n", name)
			} else {
				fmt.Fprintf(os.Stderr, "unknown theme variant: %s/%s\n", name, variant)
			}
			os.Exit(1)
		}
		cfg, err := config.Load()
		if err != nil {
			exitConfigError(err)
		}
		cfg = themecatalog.Apply(cfg, preset)
		if args[0] == "preview" {
			fmt.Println(prompt.Simulated(cfg))
			return
		}
		if err := config.Save(cfg); err != nil {
			exitConfigError(err)
		}
		label := preset.ID
		if preset.Variant != "" {
			label += " (" + preset.Variant + ")"
		}
		fmt.Printf("✓ theme applied: %s\n", label)
	default:
		fmt.Fprintf(os.Stderr, "unknown theme command: %s\n", args[0])
		os.Exit(1)
	}
}

func parseThemeSelection(args []string) (string, string, error) {
	if len(args) == 0 {
		return "", "", fmt.Errorf("requires a name")
	}
	name := args[0]
	variant := ""
	for index := 1; index < len(args); index++ {
		switch args[index] {
		case "--variant":
			index++
			if index >= len(args) || strings.TrimSpace(args[index]) == "" {
				return "", "", fmt.Errorf("--variant requires a value")
			}
			if variant != "" {
				return "", "", fmt.Errorf("--variant may be specified only once")
			}
			variant = args[index]
		default:
			return "", "", fmt.Errorf("unexpected argument %q", args[index])
		}
	}
	return name, variant, nil
}

'''
          text = text[:start] + replacement + text[end:]

          start = text.index("func sortedThemeNames() []string {")
          end = text.index("func editDistance", start)
          replacement = r'''func sortedThemeNames() []string {
	presets := themecatalog.List()
	names := make([]string, 0, len(presets))
	for _, preset := range presets {
		names = append(names, preset.ID)
	}
	sort.Strings(names)
	return names
}

'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY
          go install golang.org/x/tools/cmd/goimports@v0.36.0
          goimports -w cmd/ozsh/main_v2.go
      - name: Remove temporary workflow
        run: rm .github/workflows/integrate-theme-cli.yml
      - name: Commit CLI integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --name-only -z | xargs -0 git add --
          git commit -m 'feat(cli): use declarative theme catalog'
          git push origin HEAD:feat/tui-v2-fonts-themes
