name: test

on:
  push:
  pull_request:

jobs:
  go-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.4"
      - run: go test -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | awk '/^total:/ { if ($3 + 0 < 70) { print "coverage " $3 " is below 70%"; exit 1 } }'
      - run: go build -buildvcs=false ./...

  termux-build:
    runs-on: ubuntu-latest
    container:
      image: termux/termux-docker:aarch64
    steps:
      - uses: actions/checkout@v4
      - run: pkg install -y golang git
      - run: go test ./...
      - run: go build -buildvcs=false ./...
