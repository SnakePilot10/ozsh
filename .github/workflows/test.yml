name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.12"
  GOLANGCI_LINT_VERSION: "v2.4.0"
  GOVULNCHECK_VERSION: "v1.6.0"

jobs:
  # BEGIN TEMP THEME CLI MIGRATION
  integrate-theme-cli:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/tui-v2-fonts-themes' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/tui-v2-fonts-themes
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Integrate declarative theme catalog into CLI
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("cmd/ozsh/main_v2.go")
          text = path.read_text()
          import_anchor = '"github.com/snakepilot10/ozsh/internal/shell"\n'
          if import_anchor not in text:
              raise SystemExit("theme import anchor missing")
          text = text.replace(
              import_anchor,
              import_anchor + 'themecatalog "github.com/snakepilot10/ozsh/internal/themes"\n',
              1,
          )

          start = text.index("func runTheme(args []string) {")
          end = text.index("func runPlugin(args []string) {", start)
          replacement = r'''func runTheme(args []string) {
	if len(args) == 0 {
		fmt.Println("Usage: ozsh theme <list|apply|preview> [name] [--variant name]")
		os.Exit(1)
	}
	switch args[0] {
	case "list":
		if len(args) != 1 {
			fmt.Fprintln(os.Stderr, "Usage: ozsh theme list")
			os.Exit(1)
		}
		for _, name := range sortedThemeNames() {
			fmt.Println(name)
			if variants := themecatalog.Variants(name); len(variants) > 0 {
				fmt.Printf("  variants: %s\n", strings.Join(variants, ", "))
			}
		}
	case "apply", "preview":
		name, variant, err := parseThemeSelection(args[1:])
		if err != nil {
			fmt.Fprintf(os.Stderr, "theme %s error: %v\n", args[0], err)
			os.Exit(1)
		}
		cfg, err := config.Load()
		if err != nil {
			exitConfigError(err)
		}
		label := name
		if preset, ok := themecatalog.Get(name, variant); ok {
			cfg = themecatalog.Apply(cfg, preset)
			label = preset.ID
			if preset.Variant != "" {
				label += " (" + preset.Variant + ")"
			}
		} else if legacy, ok := config.Presets[name]; ok && variant == "" {
			applyTheme(cfg, legacy)
		} else {
			if variant == "" {
				fmt.Fprintf(os.Stderr, "unknown theme: %s\n", name)
			} else {
				fmt.Fprintf(os.Stderr, "unknown theme variant: %s/%s\n", name, variant)
			}
			os.Exit(1)
		}
		if args[0] == "preview" {
			fmt.Println(prompt.Simulated(cfg))
			return
		}
		if err := config.Save(cfg); err != nil {
			exitConfigError(err)
		}
		fmt.Printf("✓ theme applied: %s\n", label)
	default:
		fmt.Fprintf(os.Stderr, "unknown theme command: %s\n", args[0])
		os.Exit(1)
	}
}

func parseThemeSelection(args []string) (string, string, error) {
	if len(args) == 0 {
		return "", "", fmt.Errorf("requires a name")
	}
	name := args[0]
	variant := ""
	for index := 1; index < len(args); index++ {
		switch args[index] {
		case "--variant":
			index++
			if index >= len(args) || strings.TrimSpace(args[index]) == "" {
				return "", "", fmt.Errorf("--variant requires a value")
			}
			if variant != "" {
				return "", "", fmt.Errorf("--variant may be specified only once")
			}
			variant = args[index]
		default:
			return "", "", fmt.Errorf("unexpected argument %q", args[index])
		}
	}
	return name, variant, nil
}

func applyTheme(cfg *config.Config, preset config.ThemeConfig) {
	cfg.Theme = preset
	if user, ok := cfg.Prompt.Segments["user"]; ok {
		user.FG = preset.Accent
		cfg.Prompt.Segments["user"] = user
	}
	if status, ok := cfg.Prompt.Segments["status"]; ok {
		status.FG = preset.Error
		cfg.Prompt.Segments["status"] = status
	}
}

'''
          text = text[:start] + replacement + text[end:]

          start = text.index("func sortedThemeNames() []string {")
          end = text.index("func editDistance", start)
          replacement = r'''func sortedThemeNames() []string {
	seen := map[string]struct{}{}
	names := make([]string, 0, len(themecatalog.List())+len(config.Presets))
	for _, preset := range themecatalog.List() {
		if _, ok := seen[preset.ID]; ok {
			continue
		}
		seen[preset.ID] = struct{}{}
		names = append(names, preset.ID)
	}
	for name := range config.Presets {
		if _, ok := seen[name]; ok {
			continue
		}
		seen[name] = struct{}{}
		names = append(names, name)
	}
	sort.Strings(names)
	return names
}

'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)

          workflow = Path(".github/workflows/test.yml")
          workflow_text = workflow.read_text()
          marker_start = workflow_text.index("  # BEGIN TEMP THEME CLI MIGRATION\n")
          marker_end = workflow_text.index("  # END TEMP THEME CLI MIGRATION\n", marker_start)
          marker_end += len("  # END TEMP THEME CLI MIGRATION\n")
          workflow.write_text(workflow_text[:marker_start] + workflow_text[marker_end:])

          temporary = Path(".github/workflows/integrate-theme-cli.yml")
          if temporary.exists():
              temporary.unlink()
          PY
          go install golang.org/x/tools/cmd/goimports@v0.36.0
          goimports -w cmd/ozsh/main_v2.go
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --name-only -z | xargs -0 git add --
          git commit -m 'feat(cli): use declarative theme catalog'
          git push origin HEAD:feat/tui-v2-fonts-themes
  # END TEMP THEME CLI MIGRATION

  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Verify tidy state
        run: go mod tidy -diff
      - name: Install system lint tooling
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Install golangci-lint
        run: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
      - name: Lint and type checks
        run: scripts/lint.sh --check

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Go vulnerability scan
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Require zsh
        run: command -v zsh
      - name: Run tests with coverage
        run: |
          set -o pipefail
          go test -coverprofile=coverage.out ./... 2>&1 | tee test-output.log
      - name: Enforce coverage floor
        run: go tool cover -func=coverage.out | awk '/^total:/ { if ($3 + 0 < 70) { print "coverage " $3 " is below 70%"; exit 1 } }'
      - name: Run race tests
        run: go test -race ./...
      - name: Build
        run: go build -buildvcs=false ./...
      - name: Release smoke test
        run: scripts/release-smoke.sh
      - name: Installer smoke test
        run: scripts/install-smoke.sh
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-diagnostics-linux
          path: |
            coverage.out
            test-output.log
          if-no-files-found: ignore

  android-termux-cross-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -buildvcs=false ./cmd/ozsh
