name: test

on:
  push:
  pull_request:

jobs:
  go-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.4"
      - name: Run tests
        run: |
          set -o pipefail
          go test -coverprofile=coverage.out ./... 2>&1 | tee test-output.log
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ matrix.os }}
          path: |
            coverage.out
            test-output.log
          if-no-files-found: ignore
      - run: go tool cover -func=coverage.out | awk '/^total:/ { if ($3 + 0 < 70) { print "coverage " $3 " is below 70%"; exit 1 } }'
      - run: go build -buildvcs=false ./...
      - run: scripts/release-smoke.sh
      - run: scripts/install-smoke.sh

  android-termux-cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.4"
      - run: GOOS=android GOARCH=arm64 go build -buildvcs=false ./cmd/ozsh
