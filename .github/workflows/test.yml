name: test

on:
  push:
  pull_request:

jobs:
  go-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.4"
      - run: go test -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | awk '/^total:/ { if ($3 + 0 < 70) { print "coverage " $3 " is below 70%"; exit 1 } }'
      - run: go build -buildvcs=false ./...
      - run: scripts/release-smoke.sh
      - run: scripts/install-smoke.sh

  android-termux-cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.4"
      - run: GOOS=android GOARCH=arm64 go build -buildvcs=false ./cmd/ozsh
