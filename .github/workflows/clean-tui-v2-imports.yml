name: Clean TUI v2 imports

on:
  push:
    branches:
      - feat/tui-v2-fonts-themes

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/tui-v2-fonts-themes
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25.12'
      - name: Remove obsolete alias and organize imports
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("internal/tui/tui_v2_part2.go")
          text = path.read_text()
          obsolete = "func (m Model) dashboard() string { return m.home() }\n\n"
          if obsolete not in text:
              raise SystemExit("obsolete dashboard alias not found")
          path.write_text(text.replace(obsolete, "", 1))
          PY
          go install golang.org/x/tools/cmd/goimports@v0.36.0
          goimports -w internal/tui/tui_v2_part*.go
      - name: Remove temporary workflow
        run: rm .github/workflows/clean-tui-v2-imports.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --name-only -z | xargs -0 git add --
          git commit -m 'fix: organize TUI v2 imports'
          git push origin HEAD:feat/tui-v2-fonts-themes
